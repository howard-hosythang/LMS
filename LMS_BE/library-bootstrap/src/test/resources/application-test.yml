# Test profile — override production config
spring:
  # Datasource sẽ được override bởi @DynamicPropertySource trong test class
  datasource:
    url: jdbc:postgresql://localhost:5432/library_test
    username: test
    password: test

  jpa:
    show-sql: false

  # Disable Kafka auto-connect
  kafka:
    bootstrap-servers: localhost:9999
    listener:
      auto-startup: false
    consumer:
      auto-offset-reset: earliest
    admin:
      fail-fast: false
      properties:
        request.timeout.ms: 1000
        default.api.timeout.ms: 1000
        retries: 0

  # Flyway dùng migration từ main resources
  flyway:
    enabled: true
    locations: classpath:db/migration

  # Tắt OAuth2 client
  security:
    oauth2:
      client:
        registration: {}

  # Tắt scheduling
  task:
    scheduling:
      enabled: false

# Tắt schedulers
scheduling:
  enabled: false

logging:
  level:
    root: INFO
    org.apache.kafka: ERROR
    org.hibernate.SQL: WARN
    org.springframework.jdbc.core: WARN
    org.springframework.web: WARN

# AWS S3 — dùng giá trị dummy để không kết nối thật
aws:
  s3:
    bucket: test-bucket
    region: us-east-1
    access-key: test
    secret-key: test
