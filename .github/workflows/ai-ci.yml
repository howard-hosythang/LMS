name: AI CI

on:
  push:
    branches: [main]
    paths:
      - 'LMS_AI/**'
      - '.github/workflows/ai-*.yml'
  pull_request:
    branches: [main]
    paths:
      - 'LMS_AI/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ./LMS_AI

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: ./LMS_AI/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m compileall api_service.py worker.py ai_etl ai_gateway scripts tests

      - name: Run contract and regression tests
        run: python -m pytest -q

      - name: Build production image
        run: docker build --tag library74-ai:${{ github.sha }} .
