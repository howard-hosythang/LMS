name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - 'LMS_FE/**'
      - '.github/workflows/frontend-*.yml'
  pull_request:
    branches: [main]
    paths:
      - 'LMS_FE/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./LMS_FE

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ./LMS_FE/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --runInBand

      - name: Build application
        run: npm run build

      - name: Build production image
        run: docker build --tag library74-frontend:${{ github.sha }} .
