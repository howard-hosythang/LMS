name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'LMS_BE/**'
      - '.github/workflows/backend-*.yml'
  pull_request:
    branches: [main]
    paths:
      - 'LMS_BE/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ./LMS_BE

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run unit and integration tests
        run: mvn --batch-mode --no-transfer-progress test

      - name: Build production image
        run: docker build --tag library74-backend:${{ github.sha }} .
