global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: library74-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - backend:8080

  - job_name: library74-cadvisor
    static_configs:
      - targets:
          - cadvisor:8080

  - job_name: library74-node
    static_configs:
      - targets:
          - node-exporter:9100

  - job_name: library74-prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: library74-alertmanager
    static_configs:
      - targets:
          - alertmanager:9093
