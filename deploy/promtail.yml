server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker-containers
    static_configs:
      - targets:
          - localhost
        labels:
          job: docker
          host: library74
          __path__: /var/lib/docker/containers/*/*.log
    pipeline_stages:
      - json:
          expressions:
            time: time
            stream: stream
            attrs: attrs
            tag: attrs.tag
      - labels:
          stream:
      - timestamp:
          source: time
          format: RFC3339Nano
          action_on_failure: skip
